# Daily Postgres backup → object storage.
#
# This workflow runs once per day at 09:00 UTC and performs the actual
# `pg_dump | gzip | upload` work inside GitHub Actions. The backup is not
# delegated to the Replit Autoscale web deployment because the backup needs a
# scheduled worker with PostgreSQL client tooling and must run even when the
# web deployment has scaled to zero.
#
# Required GitHub Action repository secrets:
#   - SUPABASE_DATABASE_URL
#   - SUPABASE_URL
#   - SUPABASE_STORAGE_BUCKET
#   - SUPABASE_SERVICE_ROLE_KEY
#
# The script is idempotent per UTC day: reruns overwrite the same
# `backups/db/YYYY-MM-DD.sql.gz` object, then the verification step confirms
# today's backup exists and has a plausible size.
name: Daily DB backup

on:
  schedule:
    # 09:00 UTC every day. Choose a window outside the team's working
    # hours to minimise lock contention against Supabase.
    - cron: "0 9 * * *"
  workflow_dispatch: {}
  # Verify the production path when its workflow or scripts change on main.
  # A release operator can also push a one-time backup-verify-* tag, without
  # enabling backups on ordinary application pushes.
  push:
    branches:
      - main
    paths:
      - ".github/workflows/db-backup.yml"
      - "artifacts/api-server/scripts/db-backup.mjs"
      - "artifacts/api-server/scripts/db-backup-check.mjs"
      - "artifacts/api-server/scripts/lib/backup-alerts.mjs"
    tags:
      - "backup-verify-*"

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install dependencies
        run: |
          set -euo pipefail
          corepack enable
          pnpm install --frozen-lockfile

      - name: Install PostgreSQL 17 pg_dump wrapper
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/.github/bin"
          cat > "$GITHUB_WORKSPACE/.github/bin/pg_dump17" <<'EOF'
          #!/usr/bin/env bash
          set -euo pipefail
          docker run --rm \
            -e PGHOST \
            -e PGPORT \
            -e PGDATABASE \
            -e PGUSER \
            -e PGPASSWORD \
            -e PGSSLMODE \
            postgres:17 pg_dump "$@"
          EOF
          chmod +x "$GITHUB_WORKSPACE/.github/bin/pg_dump17"

      - name: Run production backup
        env:
          SUPABASE_DATABASE_URL: ${{ secrets.SUPABASE_DATABASE_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_STORAGE_BUCKET: ${{ secrets.SUPABASE_STORAGE_BUCKET }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          PG_DUMP_BIN: ${{ github.workspace }}/.github/bin/pg_dump17
          LOG_LEVEL: info
        run: |
          set -euo pipefail
          pnpm --filter @workspace/api-server run backup:db

      - name: Verify today's backup
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_STORAGE_BUCKET: ${{ secrets.SUPABASE_STORAGE_BUCKET }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          LOG_LEVEL: info
        run: |
          set -euo pipefail
          pnpm --filter @workspace/api-server run backup:check

  alert:
    needs: backup
    if: ${{ always() && needs.backup.result == 'failure' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - name: Record failure and notify the owner
        uses: actions/github-script@v7
        env:
          BACKUP_WEBHOOK_URL: ${{ secrets.BACKUP_WEBHOOK_URL }}
          BACKUP_TRIGGER_SECRET: ${{ secrets.BACKUP_TRIGGER_SECRET }}
        with:
          script: |
            const runUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const title = 'Scheduled backup needs attention';
            const body = `The scheduled backup or verification did not succeed. Review [the workflow run](${runUrl}), correct the cause, and rerun the backup and restore checks. Do not post data, credentials, or private logs in this issue.`;
            // This public record contains only a workflow link. It also remains
            // available if the application or its SMTP provider is unavailable.
            try {
              const { data: issues } = await github.rest.issues.listForRepo({ ...context.repo, state: 'open', creator: 'github-actions[bot]', per_page: 100 });
              const existing = issues.find(issue => issue.title === title);
              if (existing) await github.rest.issues.createComment({ ...context.repo, issue_number: existing.number, body });
              else await github.rest.issues.create({ ...context.repo, title, body, assignees: [context.repo.owner] });
            } catch { core.setFailed('Could not record the backup failure in GitHub.'); }
            try {
              const endpoint = new URL(process.env.BACKUP_WEBHOOK_URL);
              if (endpoint.protocol !== 'https:' || !process.env.BACKUP_TRIGGER_SECRET) throw new Error('Missing configuration');
              endpoint.pathname = '/api/internal/backup-alert';
              endpoint.search = ''; endpoint.hash = '';
              const result = await fetch(endpoint, { method: 'POST', signal: AbortSignal.timeout(20000), headers: { 'content-type': 'application/json', 'x-requested-with': 'XMLHttpRequest', 'x-backup-secret': process.env.BACKUP_TRIGGER_SECRET }, body: JSON.stringify({ runUrl }) });
              if (!result.ok) throw new Error('Delivery failed');
              core.info('Backup failure email accepted by the application.');
            } catch { core.setFailed('Backup failure email could not be delivered. Review the repository failure record.'); }
