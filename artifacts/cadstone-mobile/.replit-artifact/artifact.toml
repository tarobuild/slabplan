kind = "mobile"
previewPath = "/slabplan-mobile/"
title = "SlabPlan Mobile"
version = "1.0.0"
id = "artifacts/cadstone-mobile"
router = "expo-domain"

[[integratedSkills]]
name = "expo"
version = "1.0.0"

[[services]]
ensurePreviewReachable = "/status"
name = "expo"
paths = [ "/" ]
localPort = 22477

[services.development]
run = "pnpm --filter @workspace/cadstone-mobile run start:replit"

[services.env]
PORT = "22477"
BASE_PATH = "/slabplan-mobile/"
EXPO_PUBLIC_STONE_TRACK_API_BASE_URL = "https://slabplan-api-production.up.railway.app"
